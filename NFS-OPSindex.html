<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日本フライトサービス — 運航管理</title>
<style>
  :root{
    --bg:#0a0a0b; --bg-2:#121214; --bg-3:#1a1a1e;
    --line:#26262c; --line-2:#33333b;
    --txt:#e8e8ec; --txt-dim:#9a9aa5; --txt-faint:#5f5f6b;
    --accent:#3b82f6; --accent-2:#1d4ed8;
    --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; --purple:#a855f7;
    --radius:10px; --shadow:0 8px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
    font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:inherit}

  #app{display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s ease}
  .brand{padding:20px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
  .brand .name{font-weight:700;font-size:13px;line-height:1.2}
  .brand .name small{display:block;color:var(--txt-faint);font-weight:500;font-size:10px;letter-spacing:1px}

  .nav{flex:1;overflow-y:auto;padding:10px 8px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--txt-dim);font-size:13px;font-weight:500;margin-bottom:2px;width:100%;text-align:left;transition:.15s}
  .nav-item:hover{background:var(--bg-3);color:var(--txt)}
  .nav-item.active{background:var(--accent);color:#fff}
  .nav-item .ico{width:16px;text-align:center;font-size:14px}
  .nav-sep{margin:14px 12px 6px;font-size:10px;letter-spacing:1.5px;color:var(--txt-faint);font-weight:600}

  .sidebar-foot{padding:12px;border-top:1px solid var(--line)}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--bg-3)}
  .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff}
  .user-chip .meta{flex:1;min-width:0}
  .user-chip .meta b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-chip .meta span{font-size:10px;color:var(--txt-faint);letter-spacing:.5px}

  .main{flex:1;margin-left:230px;min-width:0;display:flex;flex-direction:column}
  .topbar{height:58px;border-bottom:1px solid var(--line);background:rgba(10,10,11,.85);backdrop-filter:blur(12px);position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:0 20px}
  .topbar h1{font-size:15px;font-weight:600}
  .topbar .sub{color:var(--txt-faint);font-size:12px}
  .topbar .spacer{flex:1}
  .hamburger{display:none;font-size:20px;padding:6px 10px;border-radius:8px}
  .hamburger:hover{background:var(--bg-3)}
  .content{padding:20px;flex:1;min-width:0;overflow-x:hidden}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--bg-3);color:var(--txt);border:1px solid var(--line-2);transition:.15s;white-space:nowrap}
  .btn:hover{background:#22222a;border-color:#444}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.danger{background:transparent;border-color:#5b1d1d;color:#f87171}
  .btn.danger:hover{background:#2a1111}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--txt-dim)}
  .btn.ghost:hover{background:var(--bg-3);color:var(--txt)}
  .btn.sm{padding:5px 10px;font-size:12px}

  .card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .card-h h3{font-size:13px;font-weight:600}
  .card-h .hint{font-size:11px;color:var(--txt-faint)}

  .cal-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .cal-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .cal-toolbar .month{font-size:20px;font-weight:700;min-width:160px}
  .cal-toolbar .filters{flex-wrap:wrap;min-width:0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:980px}
  .cal-dow{background:var(--bg-3);padding:10px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--txt-dim);letter-spacing:1px}
  .cal-dow.sat{color:#60a5fa}
  .cal-dow.sun{color:#f87171}
  .cal-cell{background:var(--bg-2);min-height:150px;padding:8px;position:relative;cursor:pointer;transition:.12s;overflow:hidden;display:flex;flex-direction:column;gap:4px}
  .cal-cell:hover{background:var(--bg-3)}
  .cal-cell.other{opacity:.35}
  .cal-cell.today{box-shadow:inset 0 0 0 2px var(--accent);background:#0f1622}
  .cal-cell.sat{background:#0e1620}
  .cal-cell.sun{background:#1a0e10}
  .cal-date{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .cal-date .d{font-size:14px;font-weight:700;color:var(--txt-dim)}
  .cal-cell.today .cal-date .d{color:var(--accent)}
  .cal-cell.sat .cal-date .d{color:#60a5fa}
  .cal-cell.sun .cal-date .d{color:#f87171}
  .cal-date .count{font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--bg-3);color:var(--txt-dim);border:1px solid var(--line-2)}
  .cal-cell.today .cal-date .count{background:var(--accent);color:#fff;border-color:var(--accent)}
  .flight-chip{display:grid;grid-template-columns:auto 1fr;gap:6px;padding:5px 7px;border-radius:6px;margin-bottom:3px;background:var(--bg-3);border-left:3px solid var(--accent);font-size:11px;line-height:1.3;cursor:pointer;transition:.1s;overflow:hidden;align-items:center}
  .flight-chip:hover{background:#22222a;transform:translateX(2px)}
  .flight-chip .time{font-family:ui-monospace,monospace;font-weight:700;font-size:11.5px;color:#fff;white-space:nowrap}
  .flight-chip .info{display:flex;flex-direction:column;gap:1px;min-width:0}
  .flight-chip .no{font-weight:700;font-size:10.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flight-chip .rt{font-size:10px;color:var(--txt-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flight-chip.delayed{border-left-color:var(--warn);background:#2a2210}
  .flight-chip.delayed .time,.flight-chip.delayed .no{color:#fbbf24}
  .flight-chip.cancelled{border-left-color:var(--danger);background:#1a0e0e;opacity:.65}
  .flight-chip.cancelled .no{text-decoration:line-through}
  .flight-chip.cancelled .time{color:#f87171}
  .flight-chip.diverted{border-left-color:var(--purple);background:#231733}
  .flight-chip.diverted .time,.flight-chip.diverted .no{color:#c084fc}
  .flight-chip.ferry{border-left-color:#0d9488;background:#0b2323}
  .flight-chip.ferry .time{color:#a7f3d0}
  .cal-more{font-size:10px;color:var(--txt-faint);padding:3px 6px;text-align:center;background:var(--bg-3);border-radius:5px;margin-top:2px;cursor:pointer}
  .cal-more:hover{color:var(--txt)}

  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .input,.select{background:var(--bg);border:1px solid var(--line-2);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:12px;outline:none;transition:.15s;max-width:100%}
  .input:focus,.select:focus{border-color:var(--accent)}
  .input::placeholder{color:var(--txt-faint)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;padding:9px 10px;font-size:11px;color:var(--txt-faint);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:hover td{background:var(--bg-3)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .badge.scheduled{background:#0e2a4a;color:#60a5fa}
  .badge.delayed{background:#3a2a08;color:#fbbf24}
  .badge.cancelled{background:#3a0f0f;color:#f87171}
  .badge.diverted{background:#2e1a3f;color:#c084fc}
  .badge.active{background:#0d2e1a;color:#4ade80}
  .badge.maintenance{background:#3a2a08;color:#fbbf24}
  .badge.reserve{background:#0e2a4a;color:#60a5fa}
  .badge.manager{background:#2e1a3f;color:#c084fc}
  .badge.general{background:#26262c;color:#9a9aa5}
  .badge.viewer{background:#26262c;color:#9a9aa5}
  .badge.online{background:#0d2e1a;color:#4ade80}
  .badge.offline{background:#3a0f0f;color:#f87171}
  .badge.pending{background:#3a2a08;color:#fbbf24}
  .badge.synced{background:#0d2e1a;color:#4ade80}
  .badge.domestic{background:#0e2a4a;color:#60a5fa}
  .badge.international{background:#2e1a3f;color:#c084fc}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-2);z-index:1}
  .modal-h h3{font-size:15px;font-weight:600}
  .modal-b{padding:20px}
  .modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg-2)}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;color:var(--txt-dim);margin-bottom:5px;font-weight:600}
  .field .input,.field .select{width:100%}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .delay-presets{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .delay-presets button{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-dim)}
  .delay-presets button:hover{background:#22222a;color:var(--txt)}

  .preview-box{background:var(--bg-3);padding:12px;border-radius:8px;margin-bottom:14px;border:1px solid var(--line)}
  .preview-box .pb-title{font-size:11px;color:var(--txt-faint);margin-bottom:8px}
  .preview-box.warn{border-color:#5b3a08;background:#2a2210}
  .preview-box.divert{border-color:#4a2a6a;background:#231733}

  #toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--bg-3);border:1px solid var(--line-2);border-left:3px solid var(--accent);padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);animation:slideIn .25s ease;max-width:340px}
  .toast.ok{border-left-color:var(--ok)}
  .toast.warn{border-left-color:var(--warn)}
  .toast.err{border-left-color:var(--danger)}
  @keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  #login{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:100%;max-width:400px}
  .login-card .brand{justify-content:center;border:none;padding:0 0 26px}
  .login-card .brand .logo{width:46px;height:46px;font-size:17px;border-radius:12px}
  .login-card .brand .name{font-size:16px}
  .login-card .card{padding:24px}
  .login-card .card h2{font-size:16px;margin-bottom:4px}
  .login-card .card p.hint{font-size:12px;color:var(--txt-faint);margin-bottom:20px}
  .login-card .btn{width:100%;justify-content:center;padding:10px}

  .pw-gate{max-width:420px;margin:60px auto;text-align:center;background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:32px 24px}
  .pw-gate .lock-ico{font-size:36px;margin-bottom:14px}
  .pw-gate h3{font-size:16px;margin-bottom:6px}
  .pw-gate p{font-size:12px;color:var(--txt-faint);margin-bottom:20px}
  .pw-gate .field{text-align:left}

  .empty{text-align:center;padding:40px 20px;color:var(--txt-faint);font-size:13px}
  .flex{display:flex;align-items:center;gap:8px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .stat{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .stat .k{font-size:11px;color:var(--txt-faint);margin-bottom:6px}
  .stat .v{font-size:26px;font-weight:700}
  .lock-note{font-size:11px;color:var(--warn);margin-top:8px}
  .info-note{font-size:11px;color:var(--txt-faint);margin-top:8px}
  .readonly-note{background:#2a2210;border:1px solid #5b3a08;color:#fbbf24;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:14px}

  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none}
  .backdrop.show{display:block}

  .ops-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .ops-header .date-label{font-size:18px;font-weight:700;min-width:150px}
  .ops-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--txt-dim);margin-bottom:10px}
  .ops-legend .item{display:flex;align-items:center;gap:5px}
  .ops-legend .dot{width:12px;height:12px;border-radius:3px}

  .gantt-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-2)}
  .gantt{min-width:1400px;position:relative}
  .gantt-row{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid var(--line);min-height:56px}
  .gantt-row:last-child{border-bottom:none}
  .gantt-row.header{background:var(--bg-3);min-height:34px;position:sticky;top:0;z-index:3}
  .gantt-ac{padding:8px 10px;border-right:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;gap:2px;justify-content:center;position:sticky;left:0;z-index:2}
  .gantt-ac b{font-size:12px;font-family:ui-monospace,monospace}
  .gantt-ac span{font-size:10px;color:var(--txt-faint)}
  .gantt-ac .loc{font-size:10px;color:var(--accent)}
  .gantt-track{position:relative;background:var(--bg-2)}
  .gantt-hour{position:absolute;top:0;bottom:0;border-left:1px solid #1e1e24;pointer-events:none}
  .gantt-hour.major{border-left-color:#2e2e36}
  .flight-bar{position:absolute;top:8px;height:32px;border-radius:6px;background:var(--accent);color:#fff;font-size:10.5px;display:flex;align-items:center;padding:0 6px;gap:5px;white-space:nowrap;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.08);transition:filter .12s;z-index:1;min-width:20px}
  .flight-bar:hover{filter:brightness(1.15);z-index:4}
  .flight-bar.delayed{background:var(--warn);color:#1a1a1a}
  .flight-bar.cancelled{background:#3a0f0f;color:#f87171;text-decoration:line-through;opacity:.7}
  .flight-bar.diverted{background:var(--purple);color:#fff}
  .flight-bar.ferry{background:#0e6b6b;color:#a7f3d0;border-color:#0d9488}
  .flight-bar .fb-no{font-weight:700}
  .flight-bar .fb-rt{opacity:.85;font-size:10px}
  .flight-bar .fb-time{opacity:.75;font-size:9.5px;margin-left:auto}
  .gantt-hour-label{font-size:10px;color:var(--txt-faint);text-align:center;position:relative;height:34px;display:flex;align-items:center;justify-content:center}
  .turnaround-gap{position:absolute;top:14px;height:20px;border-radius:3px;background:repeating-linear-gradient(45deg,#1e2a3a,#1e2a3a 4px,#0e1a2a 4px,#0e1a2a 8px);border:1px dashed #2a3a5a;z-index:0}
  .turnaround-gap.tight{background:repeating-linear-gradient(45deg,#3a1e1e,#3a1e1e 4px,#2a0e0e 4px,#2a0e0e 8px);border-color:#5a2a2a}
  .now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:5;pointer-events:none;opacity:.8}
  .now-line::after{content:'NOW';position:absolute;top:2px;left:4px;font-size:9px;color:var(--danger);font-weight:700}

  .log-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .log-actor{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--txt-dim)}
  .log-action{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#0e2a4a;color:#60a5fa}
  .log-action.edit{background:#3a2a08;color:#fbbf24}
  .log-action.delete{background:#3a0f0f;color:#f87171}
  .log-action.login{background:#0d2e1a;color:#4ade80}
  .log-action.logout{background:#26262c;color:#9a9aa5}
  .log-action.maint{background:#2e1a3f;color:#c084fc}
  .log-action.system{background:#0e2a4a;color:#60a5fa}
  .log-detail{font-size:11.5px;color:var(--txt-dim)}
  .log-time{font-family:ui-monospace,monospace;font-size:11px;color:var(--txt-faint)}

  .tt-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .tt-tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;background:var(--bg-3);color:var(--txt-dim);border:1px solid var(--line-2);transition:.15s}
  .tt-tab:hover{background:#22222a;color:var(--txt)}
  .tt-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tt-section{margin-bottom:22px}
  .tt-section-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-3);border-radius:8px;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .tt-section-h .route{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.5px}
  .tt-section-h .route .arrow{color:var(--accent)}
  .tt-section-h .route .ap{font-family:ui-monospace,monospace;padding:2px 10px;border-radius:6px;background:var(--bg);border:1px solid var(--line-2)}
  .tt-section-h .ac-info{font-size:11px;color:var(--txt-dim)}
  .tt-section-h .ac-info b{color:var(--txt);font-family:ui-monospace,monospace}
  .tt-grid{display:grid;grid-template-columns:80px 1fr 1fr 1fr 1fr 100px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .tt-th{background:var(--bg-3);padding:8px 10px;font-size:10.5px;font-weight:700;color:var(--txt-faint);letter-spacing:1px;text-align:center}
  .tt-td{background:var(--bg-2);padding:10px;font-size:12.5px;text-align:center;font-family:ui-monospace,monospace;transition:.12s}
  .tt-td.flight-no{font-weight:700;color:var(--accent);font-size:13px}
  .tt-td.time{font-weight:700;font-size:14px;color:#fff}
  .tt-td.ta{font-size:11px;color:var(--warn)}
  .tt-td.pair-start{border-top:2px solid var(--accent-2)}

  .sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-dim);padding:2px 10px;border-radius:20px;background:var(--bg-3);border:1px solid var(--line-2)}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--txt-faint)}
  .sync-dot.online{background:var(--ok)}

    toast('ユーザーデータがありません。リセットします。','err');

      <td><button class="btn ghost sm" onclick="openFlight('${f.id}')">開く</button></td>`;

}
function statusBadge(f){
  let label = STATUS_JA[f.status] || f.status;

}

  const wrap = document.createElement('div');

    <button class="btn sm" onclick="calNav(-1)">‹ 前月</button>

    <button class="btn sm" onclick="calToday()">今月</button>

    <div class="filters">
      <input class="input" id="fq" placeholder="便名・区間で検索…" value="${state.filters.q}">
      <select class="select" id="fstatus">
        <option value="">全状態</option>
        ${STATUS.map(s=>`<option value="${s}" ${state.filters.status===s?'selected':''}>${STATUS_JA[s]}</option>`).join('')}
      </select>
      <select class="select" id="fac">
        <option value="">全機材</option>
        ${state.fleet.map(a=>`<option value="${a.id}" ${state.filters.ac===a.id?'selected':''}>${a.reg}</option>`).join('')}
      </select>
      <select class="select" id="ffrom">
        <option value="">出発地すべて</option>
        ${AIRPORTS.map(a=>`<option value="${a.code}" ${state.filters.from===a.code?'selected':''}>${a.code} ${a.name}</option>`).join('')}
      </select>
      <select class="select" id="fto">
        <option value="">到着地すべて</option>
        ${AIRPORTS.map(a=>`<option value="${a.code}" ${state.filters.to===a.code?'selected':''}>${a.code} ${a.name}</option>`).join('')}
      </select>
    </div>`;
  wrap.appendChild(tb);

  const calWrap = document.createElement('div');
  calWrap.className = 'cal-wrap';
  const grid = document.createElement('div');
  grid.className='cal-grid';
  const dows = ['月','火','水','木','金','土','日'];
  dows.forEach((d,i)=>{
    const h=document.createElement('div');
    h.className='cal-dow'+(i===5?' sat':'')+(i===6?' sun':'');
    h.textContent=d;
    grid.appendChild(h);
  });

  const [y,m] = state.calMonth.split('-').map(Number);
  const first = new Date(y,m-1,1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(y,m,0).getDate();
  const prevDays = new Date(y,m-1,0).getDate();
  const today = todayStr();

  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:new Date(y,m-2,prevDays-i), other:true});
  for(let d=1;d<=daysInMonth;d++) cells.push({d:new Date(y,m-1,d), other:false});
  let nextDay = 1;
  while(cells.length%7!==0){ cells.push({d:new Date(y,m,nextDay++), other:true}); }

  cells.forEach(cell=>{
    const ds = fmtDate(cell.d);
    const dow = cell.d.getDay();
    const isSat = dow===6, isSun = dow===0;
    const el = document.createElement('div');
    el.className = 'cal-cell'+(cell.other?' other':'')+(ds===today?' today':'')+(isSat?' sat':'')+(isSun?' sun':'');
    el.onclick = (e)=>{ if(e.target===el) openDay(ds); };

    let fl = applyFilters(state.flights.filter(f=>f.date===ds));
    fl.sort((a,b)=>timeToMin(a.dep)-timeToMin(b.dep));

    const dateEl = document.createElement('div');
    dateEl.className='cal-date';
    dateEl.innerHTML = `<span class="d">${cell.d.getDate()}</span><span class="count">${fl.length}</span>`;
    el.appendChild(dateEl);

    fl.slice(0,5).forEach(f=>{
      const chip = document.createElement('div');
      let cls = 'flight-chip ' + f.status;
      if(f.note && f.note.includes('整備回送')) cls += ' ferry';
      chip.className = cls;
      const timeStr = f.delayMin>0
        ? `${f.dep}<span style="color:var(--warn);font-size:9px">+${f.delayMin}</span>`
        : `${f.dep}`;
      chip.innerHTML = `
        <span class="time">${timeStr}</span>
        <span class="info">
          <span class="no">${f.no}</span>
          <span class="rt">${f.from}→${f.to}</span>
        </span>`;
      chip.title = `${f.no} ${f.from}→${f.to} ${f.dep}-${f.arr} (${acReg(f.ac)})`;
      chip.onclick = (e)=>{ e.stopPropagation(); openFlight(f.id); };
      el.appendChild(chip);
    });
    if(fl.length>5){
      const more=document.createElement('div'); more.className='cal-more';
      more.textContent = `+${fl.length-5} 件を表示`;
      more.onclick=(e)=>{e.stopPropagation();openDay(ds);};
      el.appendChild(more);
    }
    grid.appendChild(el);
  });
  calWrap.appendChild(grid);
  wrap.appendChild(calWrap);
  c.appendChild(wrap);

  const bind = (id, key) => {
    const el = $('#'+id);
    el.oninput = ()=>{ state.filters[key]=el.value; render(); };
    el.onchange = ()=>{ state.filters[key]=el.value; render(); };
  };
  bind('fq','q'); bind('fstatus','status'); bind('fac','ac'); bind('ffrom','from'); bind('fto','to');
}
function applyFilters(list){
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  return list.filter(x=>{
    if(f.status && x.status!==f.status) return false;
    if(f.ac && x.ac!==f.ac) return false;
    if(f.from && x.from!==f.from) return false;
    if(f.to && x.to!==f.to) return false;
    if(q){
      const hay = `${x.no} ${x.from} ${x.to} ${acReg(x.ac)}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return `${y}年${m}月`; }
function calNav(d){
  const [y,m]=state.calMonth.split('-').map(Number);
  const nd = new Date(y,m-1+d,1);
  state.calMonth = `${nd.getFullYear()}-${pad(nd.getMonth()+1)}`;
  render();
}
function calToday(){
  const n=new Date();
  state.calMonth = `${n.getFullYear()}-${pad(n.getMonth()+1)}`;
  render();
}

  const wrap = document.createElement('div');
  const tb = document.createElement('div');

  tb.innerHTML = `
    <button class="btn sm" onclick="opsNav(-1)">‹ 前日</button>

    </select>`;
  wrap.appendChild(tb);

  const legend = document.createElement('div');
  legend.className = 'ops-legend';
  legend.innerHTML = `
    <div class="item"><span class="dot" style="background:var(--accent)"></span>通常</div>
    <div class="item"><span class="dot" style="background:var(--warn)"></span>遅延</div>

    <div class="item"><span class="dot" style="background:#0e6b6b"></span>整備回送</div>`;
  wrap.appendChild(legend);

  const ganttWrap = document.createElement('div');
  ganttWrap.className = 'gantt-wrap';
  const gantt = document.createElement('div');
  gantt.className = 'gantt';

  const headerRow = document.createElement('div');
  headerRow.className = 'gantt-row header';
  headerRow.innerHTML = `
    <div class="gantt-ac" style="background:var(--bg-3)"><b>機材</b><span>24時間</span></div>
    <div class="gantt-track"></div>`;
  gantt.appendChild(headerRow);
  const headerTrack = headerRow.querySelector('.gantt-track');
  for(let h=0; h<=24; h++){
    const lbl = document.createElement('div');
    lbl.className = 'gantt-hour-label';
    lbl.style.position = 'absolute';
    lbl.style.left = (h/24*100) + '%';
    lbl.style.transform = 'translateX(-50%)';
    lbl.textContent = h===24 ? '24' : pad(h);
    headerTrack.appendChild(lbl);
    const line = document.createElement('div');
    line.className = 'gantt-hour' + (h%3===0 ? ' major' : '');
    line.style.left = (h/24*100) + '%';
    headerTrack.appendChild(line);
  }

  let fleet = [...state.fleet];
  const fAc = ($('#opsFilterAc') || {}).value || '';
  if(fAc) fleet = fleet.filter(a=>a.id===fAc);

  fleet.forEach(a=>{
    const flights = state.flights.filter(f=>f.ac===a.id && f.date===state.opsDate)
      .sort((x,y)=>timeToMin(x.dep)-timeToMin(y.dep));
    const row = document.createElement('div');
    row.className = 'gantt-row';
    const firstFrom = flights.length ? flights[0].from : a.base;
    const lastTo = flights.length ? flights[flights.length-1].to : a.base;
    const startLoc = firstFrom === a.base ? `${a.base}発` : `${firstFrom}泊明け`;
    const endLoc = lastTo === a.base ? `${a.base}着` : `${lastTo}泊`;
    row.innerHTML = `
      <div class="gantt-ac">
        <b>${a.reg}</b>
        <span>${a.type} · ${SERVICE_JA[a.service]||''}</span>
        <span>${FLEET_STATUS_JA[a.status]}</span>
        <span class="loc">${startLoc} → ${endLoc}</span>
      </div>
      <div class="gantt-track"></div>`;
    gantt.appendChild(row);
    const track = row.querySelector('.gantt-track');

    let prev = null;
    const ta = turnaroundFor(a.id);
    flights.forEach(f=>{
      const depMin = timeToMin(f.dep);
      const arrMin = timeToMin(f.arr);
      const leftPct = (depMin/1440)*100;
      const widthPct = Math.max(((arrMin - depMin)/1440)*100, 1.5);

      if(prev){
        const gapStart = timeToMin(prev.arr);
        const gapEnd = depMin;
        const gapLen = gapEnd - gapStart;
        if(gapLen > 0){
          const gapEl = document.createElement('div');
          gapEl.className = 'turnaround-gap' + (gapLen < ta ? ' tight' : '');
          gapEl.style.left = (gapStart/1440)*100 + '%';
          gapEl.style.width = (gapLen/1440)*100 + '%';
          gapEl.title = `ターンアラウンド ${gapLen}分（基準${ta}分）`;
          track.appendChild(gapEl);
        }
      }
      prev = f;
      const bar = document.createElement('div');
      let cls = 'flight-bar ' + f.status;
      if(f.note && f.note.includes('整備回送')) cls += ' ferry';
      bar.className = cls;
      bar.style.left = leftPct + '%';
      bar.style.width = widthPct + '%';
      const timeStr = f.delayMin>0 ? `${f.dep}–${f.arr} (+${f.delayMin})` : `${f.dep}–${f.arr}`;
      bar.innerHTML = `
        <span class="fb-no">${f.no}</span>
        <span class="fb-rt">${f.from}→${f.to}</span>
        <span class="fb-time">${timeStr}</span>`;
      bar.title = `${f.no} ${f.from}→${f.to} ${timeStr} · ${a.reg}`;
      bar.onclick = ()=>openFlight(f.id);
      track.appendChild(bar);
    });
    for(let h=0; h<=24; h++){
      const line = document.createElement('div');
      line.className = 'gantt-hour' + (h%3===0 ? ' major' : '');
      line.style.left = (h/24*100) + '%';
      track.appendChild(line);
    }
  });

  if(state.opsDate === todayStr()){
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    const nowLine = document.createElement('div');
    nowLine.className = 'now-line';
    nowLine.style.left = `calc(120px + (100% - 120px) * ${nowMin/1440})`;
    gantt.appendChild(nowLine);
  }
  ganttWrap.appendChild(gantt);
  wrap.appendChild(ganttWrap);
  c.appendChild(wrap);
  const acSel = $('#opsFilterAc');
  if(acSel) acSel.onchange = ()=> render();
}

  const [y,m,d] = ds.split('-').map(Number);

}

function openMaintStart(acId){
  if(!canEditMaint()){ toast('この操作は許可されていません。','err'); return; }
  const ac = state.fleet.find(a=>a.id===acId);
  const reserves = state.fleet.filter(a=>a.status==='reserve');
  if(!reserves.length){ toast('利用可能な予備機がありません。','err'); return; }
  const today = todayStr();
  const flightCount = state.flights.filter(f=>f.ac===acId).length;
  showModal(`
    <div class="modal-h"><h3>${ac.reg} を整備へ</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="field">
        <label>予備機（スケジュール移行先）</label>
        <select class="select" id="mReserve">
          ${reserves.map(r=>`<option value="${r.id}">${r.reg} · ${r.type} · ${SERVICE_JA[r.service]}</option>`).join('')}
        </select>
      </div>
      <div class="row">
        <div class="field"><label>開始日</label><input class="input" id="mStart" type="date" value="${today}"></div>
        <div class="field"><label>終了日</label><input class="input" id="mEnd" type="date" value="${today}"></div>
      </div>
      <p class="lock-note">⚠ ${flightCount} 便が予備機へ移行します。</p>
    </div>
    <div class="modal-f">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="confirmMaintStart('${acId}')">実行</button>
    </div>`);
}
function confirmMaintStart(acId){
  const ac = state.fleet.find(a=>a.id===acId);
  const resId = $('#mReserve').value;
  const start = $('#mStart').value, end = $('#mEnd').value;
  if(!start || !end || end<start){ toast('整備期間が不正です。','err'); return; }
  const overlap = state.fleet.some(a=>a.id!==acId && a.status==='maintenance' && a.maintStart && a.maintEnd && !(end < a.maintStart || start > a.maintEnd));
  if(overlap){ toast('その期間は他の機材が整備中です。','err'); return; }

  let moved = 0;
  state.flights.forEach(f=>{ if(f.ac===acId){ f.ac = resId; moved++; } });
  const ferryOut = {id:uid(), no:'NFS8055', from:'FUK', to:'XMN', dep:'08:00', arr:'11:30', baseDep:'08:00', baseArr:'11:30', date:start, ac:acId, status:'scheduled', delayMin:0, note:'整備回送（往路）', lock:null};
  const ferryIn  = {id:uid(), no:'NFS8056', from:'XMN', to:'FUK', dep:'15:00', arr:'18:30', baseDep:'15:00', baseArr:'18:30', date:end,   ac:acId, status:'scheduled', delayMin:0, note:'整備回送（復路）', lock:null};
  state.flights.push(ferryOut, ferryIn);
  ac.status='maintenance'; ac.maintStart=start; ac.maintEnd=end; ac.assignedTo = resId;

  logAction('maint', `${ac.reg} を整備へ（${start}〜${end}）／${moved}便を ${acReg(resId)} へ移行／回送便 NFS8055, NFS8056 を自動作成`, ac.reg);
  state.pendingSync = true;
  saveLocal(); closeModal(); render();
  toast(`${ac.reg} を整備へ。${moved} 便を ${acReg(resId)} へ移行、回送便を作成しました。`,'ok');

  safeSync(async ()=>{
    await pushFleet([ac]);
    await pushFlights(state.flights.filter(f=>f.ac===acId || f.id===ferryOut.id || f.id===ferryIn.id));
    await pushFlights(state.flights.filter(f=>f.ac===resId));
  });
}
function openMaintEnd(acId){
  if(!canEditMaint()){ toast('この操作は許可されていません。','err'); return; }
  const ac = state.fleet.find(a=>a.id===acId);
  const target = ac.assignedTo;
  showModal(`
    <div class="modal-h"><h3>整備終了 · ${ac.reg}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <p style="margin-bottom:12px"><b>${target?acReg(target):'—'}</b> に割り当て中の旅客便を <b>${ac.reg}</b> へ戻します。<br>
      回送便（NFS8055/8056）は削除されます。</p>
    </div>
    <div class="modal-f">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn primary" onclick="confirmMaintEnd('${acId}')">実行</button>
    </div>`);
}
function confirmMaintEnd(acId){
  const ac = state.fleet.find(a=>a.id===acId);
  const target = ac.assignedTo;
  let moved=0;
  if(target){
    state.flights.forEach(f=>{
      if(f.ac===target && !(f.note && f.note.includes('整備回送'))){ f.ac=acId; moved++; }
    });
  }
  const removed = state.flights.filter(f=> f.ac===acId && f.note && f.note.includes('整備回送'));
  state.flights = state.flights.filter(f=> !(f.ac===acId && f.note && f.note.includes('整備回送')));
  ac.status='active'; ac.maintStart=null; ac.maintEnd=null; ac.assignedTo=null;
  logAction('maint', `${ac.reg} の整備終了／${moved}便を ${ac.reg} へ戻し、回送便を削除`, ac.reg);
  state.pendingSync = true;
  saveLocal(); closeModal(); render();
  toast(`${ac.reg} を運航復帰。${moved} 便を戻し、回送便を削除しました。`,'ok');

  safeSync(async ()=>{
    await pushFleet([ac]);
    await pushFlights(state.flights.filter(f=>f.ac===acId));
    if(target) await pushFlights(state.flights.filter(f=>f.ac===target));
    for(const r of removed){ await deleteFlightServer(r.id); }
  });
}

function changeUserRole(id, newRole){
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  const old = u.role;
  if(old === newRole) return;
  u.role = newRole;
  u.visibleInAdmin = (newRole==='manager');
  logAction('update', `権限変更: ${u.name} の権限を「${ROLE_JA[old]||old}」→「${ROLE_JA[newRole]||newRole}」`, u.name);
  saveLocal();
  toast(`${u.name} の権限を「${ROLE_JA[newRole]||newRole}」に変更しました。`,'ok');
  safeSync(()=>pushUsers([u]));
}
function filterLogs(){
  const f = state.logFilters;
  const actor = f.actor.trim().toLowerCase();
  return state.logs.filter(l=>{
    if(f.type && l.type!==f.type) return false;
    if(f.date && !l.time.startsWith(f.date)) return false;
    if(actor && !l.actor.toLowerCase().includes(actor)) return false;
    return true;
  });
}
function clearLogFilters(){ state.logFilters = {actor:'', type:'', date:''}; render(); }

        </select>

function saveUser(id){
  const name=$('#uName').value.trim(), pass=$('#uPass').value.trim(), role=$('#uRole').value;
  if(!name||!pass){ toast('ユーザー名とパスワードは必須です。','err'); return; }
  let target;
  if(id){
    target = state.users.find(x=>x.id===id);
    const old = `${target.name} / ${ROLE_JA[target.role]||target.role}`;
    Object.assign(target,{name,pass,role, visibleInAdmin:role==='manager'});
    logAction('update', `ユーザー変更: ${old} → ${name} / ${ROLE_JA[role]||role}`, name);
  } else {
    target = {id:uid(), name, pass, role, visibleInAdmin: role==='manager'};
    state.users.push(target);
    logAction('create', `ユーザー追加: ${name} / ${ROLE_JA[role]||role}`, name);
  }
  state.pendingSync = true;
  saveLocal(); closeModal(); render(); toast('ユーザーを保存しました。','ok');
  safeSync(()=>pushUsers([target]));
}
function deleteUser(id){
  if(state.session && id===state.session.id){ toast('ログイン中の自分は削除できません。','err'); return; }
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  if(u.role==='manager'){
    const managers = state.users.filter(x=>x.role==='manager');
    if(managers.length<=1){ toast('運航管理ユーザーが0人になるため削除できません。','err'); return; }
  }
  logAction('delete', `ユーザー削除: ${u.name} / ${ROLE_JA[u.role]||u.role}`, u.name);
  state.users = state.users.filter(x=>x.id!==id);
  state.pendingSync = true;
  saveLocal(); closeModal(); render(); toast('ユーザーを削除しました。','warn');
  safeSync(()=>deleteUserServer(id));
}

}
function setDelay(n){ const el = $('#fDelay'); if(el){ el.value = n; updateFlightTimes(); } }
function resetDelay(){ const el = $('#fDelay'); if(el){ el.value = 0; updateFlightTimes(); } }
function updateFlightTimes(){
  const baseDepEl = $('#fBaseDep'), baseArrEl = $('#fBaseArr');
  const delayEl = $('#fDelay'), depEl = $('#fDep'), arrEl = $('#fArr');
  const toEl = $('#fTo'), noteEl = $('#diversionNote'), box = $('#previewBox');
  if(!baseDepEl || !baseArrEl || !delayEl || !depEl || !arrEl) return;
  const baseDep = baseDepEl.value || '08:00';
  const baseArr = baseArrEl.value || '09:30';
  const delay = Math.max(0, parseInt(delayEl.value||0,10) || 0);
  const newDep = addMin(baseDep, delay);
  const newArr = addMin(baseArr, delay);
  depEl.value = newDep; arrEl.value = newArr;
  const to = toEl ? toEl.value : '';
  const isDivert = (to==='FUK' && timeToMin(newArr) >= CURFEW_MIN);
  if(box){
    box.classList.remove('warn','divert');
    if(delay>0) box.classList.add('warn');
    if(isDivert) box.classList.add('divert');
  }
  if(noteEl){
    if(isDivert){
      noteEl.innerHTML = `<span class="badge diverted">自動ダイバート</span> 福岡到着が22:00以降のため、保存すると北九州(KKJ)行きに自動変更され、後続便も連鎖します。`;
    } else if(delay>0){
      noteEl.innerHTML = `<span class="badge delayed">遅延 +${delay}分</span> 実時刻：${newDep}–${newArr}。保存すると後続便も自動で連鎖します。`;
    } else {
      noteEl.innerHTML = `<span style="color:var(--txt-faint)">遅延なし。実時刻＝定刻。</span>`;
    }
  }
}
function saveFlight(id){
  if(!canEdit()){ toast('この操作は許可されていません。','err'); return; }
  updateFlightTimes();
  const data = {
    no:$('#fNo').value.trim(), date:$('#fDate').value, ac:$('#fAc').value,
    from:$('#fFrom').value, to:$('#fTo').value,
    dep:$('#fDep').value, arr:$('#fArr').value,
    baseDep:$('#fBaseDep').value, baseArr:$('#fBaseArr').value,
    status:$('#fStatus').value,
    delayMin:parseInt($('#fDelay').value||0,10),
    note:$('#fNote').value.trim()
  };
  if(!data.no || !data.date || !data.dep || !data.arr){ toast('必須項目が未入力です。','err'); return; }
  if(data.delayMin > 0 && data.status === 'scheduled') data.status = 'delayed';
  if(data.delayMin === 0 && data.status === 'delayed') data.status = 'scheduled';

  let prevDelay = 0;
  if(id){ const prev = state.flights.find(x=>x.id===id); if(prev) prevDelay = prev.delayMin || 0; }

  let target;
  if(id){
    target = state.flights.find(x=>x.id===id);
    Object.assign(target, data); target.lock = null;
    logAction('update', `${target.no} を編集（${target.from}→${target.to} ${target.dep}-${target.arr}${target.delayMin?' +'+target.delayMin+'分':''}）`, target.no);
  } else {
    target = Object.assign({id:uid()}, data, {lock:null});
    state.flights.push(target);
    logAction('create', `${target.no} を追加（${target.from}→${target.to} ${target.dep}-${target.arr}）`, target.no);
  }

  const delta = (target.delayMin||0) - prevDelay;
  const diverted = applyAutoDiversion(target);
  const touched = [];
  if(diverted){ cascadeAfterDiversion(target, touched); }
  else if(delta !== 0){ cascadeRotation(target, delta, touched); }

  state.pendingSync = true;
  saveLocal(); closeModal(); render();
  if(!diverted) toast('便を保存しました。','ok');

  const toSync = new Set([target, ...touched]);
  safeSync(()=>pushFlights([...toSync]));
}
function deleteFlight(id){
  if(!canEdit()){ toast('この操作は許可されていません。','err'); return; }
  if(!confirm('この便を削除しますか？')) return;
  const f = state.flights.find(x=>x.id===id);
  if(f) logAction('delete', `${f.no} を削除（${f.from}→${f.to} ${f.date}）`, f.no);
  state.flights = state.flights.filter(f=>f.id!==id);
  state.pendingSync=true;
  saveLocal(); closeModal(); render();
  toast('便を削除しました。','warn');
  safeSync(()=>deleteFlightServer(id));
}
function cascadeRotation(fromFlight, delta, touched){
  if(delta === 0) return;
  const ta = turnaroundFor(fromFlight.ac);
  const sameAc = state.flights.filter(f=>f.ac===fromFlight.ac && f.id!==fromFlight.id);
  const sameDay = sameAc
    .filter(f=>f.date===fromFlight.date && timeToMin(f.dep) > timeToMin(fromFlight.dep))
    .sort((a,b)=>timeToMin(a.dep)-timeToMin(b.dep));
  let prevArr = timeToMin(fromFlight.arr);
  let carried = delta;
  sameDay.forEach(f=>{
    const minDep = prevArr + ta;
    const currentDep = timeToMin(f.dep);
    const needed = Math.max(0, minDep - currentDep);
    const addDelay = Math.max(needed, carried);
    if(addDelay > 0){
      f.dep = addMin(f.dep, addDelay);
      f.arr = addMin(f.arr, addDelay);
      f.delayMin = (f.delayMin||0) + addDelay;
      if(f.status==='scheduled') f.status='delayed';
      f.note = (f.note?f.note+' | ':'')+`遅延連鎖 +${addDelay}分（前便より）`;
      touched.push(f);
    }
    prevArr = timeToMin(f.arr);
    carried = addDelay;
  });
  const lastToday = state.flights.filter(f=>f.ac===fromFlight.ac && f.date===fromFlight.date)
    .sort((a,b)=>timeToMin(a.arr)-timeToMin(b.arr)).pop();
  if(!lastToday) return;
  const d = parseDate(fromFlight.date); d.setDate(d.getDate()+1);
  const nextDay = fmtDate(d);
  const firstNext = state.flights.filter(f=>f.ac===fromFlight.ac && f.date===nextDay)
    .sort((a,b)=>timeToMin(a.dep)-timeToMin(b.dep))[0];
  if(!firstNext) return;
  if(lastToday.to === firstNext.from){
    const minDep = timeToMin(lastToday.arr) + ta;
    const currentDep = timeToMin(firstNext.dep);
    if(minDep > currentDep && minDep < 24*60){
      const addDelay = minDep - currentDep;
      firstNext.dep = addMin(firstNext.dep, addDelay);
      firstNext.arr = addMin(firstNext.arr, addDelay);
      firstNext.delayMin = (firstNext.delayMin||0) + addDelay;
      if(firstNext.status==='scheduled') firstNext.status='delayed';
      firstNext.note = (firstNext.note?firstNext.note+' | ':'')+`翌日連鎖 +${addDelay}分（前日最終便より）`;
      touched.push(firstNext);
    }
  }
}
function applyAutoDiversion(f){
  if(f.status==='diverted' && f.to==='KKJ') return false;
  if(f.to!=='FUK') return false;
  if(timeToMin(f.arr) < CURFEW_MIN) return false;
  f.to = 'KKJ';
  f.status = 'diverted';
  f.note = (f.note?f.note+' | ':'') + '自動ダイバート：福岡カーフュー（22:00以降到着）';
  logAction('divert', `${f.no} を北九州(KKJ)へ自動ダイバート（福岡22:00以降到着）`, f.no);
  toast(`${f.no} を北九州(KKJ)へ自動ダイバートしました。`,'warn');
  return true;
}
function cascadeAfterDiversion(divertedFlight, touched){
  const later = state.flights.filter(x=>
    x.ac===divertedFlight.ac && x.date===divertedFlight.date &&
    x.id!==divertedFlight.id && timeToMin(x.dep) > timeToMin(divertedFlight.dep)
  );
  if(later.length){
    later.forEach(x=>{
      x.status='cancelled';
      x.note=(x.note?x.note+' | ':'')+'欠航：機材が北九州へダイバート';
      if(x.lock) x.lock=null;
      touched.push(x);
    });
    logAction('divert', `ダイバート連鎖で後続 ${later.length} 便を欠航: ${later.map(x=>x.no).join(', ')}`, divertedFlight.no);
    toast(`後続 ${later.length} 便を欠航にしました。`,'warn');
    return;
  }
  const d = parseDate(divertedFlight.date); d.setDate(d.getDate()+1);
  const nextDay = fmtDate(d);
  const exists = state.flights.some(x=>x.ac===divertedFlight.ac && x.date===nextDay && x.from==='KKJ' && x.to==='FUK');
  if(exists) return;
  const ferry = {
    id:uid(), no:'NFS'+Math.floor(Math.random()*9000+1000),
    from:'KKJ', to:'FUK', dep:'06:00', arr:'06:50', baseDep:'06:00', baseArr:'06:50',
    date:nextDay, ac:divertedFlight.ac, status:'scheduled', delayMin:0,
    note:'回航：機材を福岡へ戻す', lock:null
  };
  state.flights.push(ferry);
  touched.push(ferry);
  logAction('divert', `回航便 ${ferry.no} (KKJ→FUK 06:00-06:50) を ${nextDay} に自動作成`, ferry.no);
  toast(`翌日 ${nextDay} 06:00 に KKJ→FUK 回航便を設定しました。`,'warn');
  const first = state.flights.filter(x=>x.ac===divertedFlight.ac && x.date===nextDay && x.id!==ferry.id)
    .sort((a,b)=>a.dep.localeCompare(b.dep))[0];
  if(first){
    const ta = turnaroundFor(divertedFlight.ac);
    const minDep = timeToMin(ferry.arr) + ta;
    if(timeToMin(first.dep) < minDep){
      const newDep = addMin(ferry.arr, ta);
      const dur = timeToMin(first.arr) - timeToMin(first.dep);
      const newArr = addMin(newDep, dur);
      first.baseDep = first.baseDep || first.dep;
      first.baseArr = first.baseArr || first.arr;
      const addDelay = timeToMin(newDep) - timeToMin(first.dep);
      first.dep = newDep; first.arr = newArr;
      first.status = 'delayed';
      first.delayMin = (first.delayMin||0) + addDelay;
      first.note = (first.note?first.note+' | ':'')+'遅延：回航便到着待ち';
      touched.push(first);
    }
  }
}

const LOG_TYPE_JA = {

function logAction(type, detail, target=''){
  const actor = state.session ? state.session.name : 'system';
  const entry = {
    id: uid(), time: nowStamp(), actor,
    role: state.session ? state.session.role : '-',

/* ============================================================
   Supabase（遅延接続 / 安全ラッパ）
   ============================================================ */
function safeSync(fn){
  if(!state.supabase){
    // サーバー未接続：ローカルだけに保存
    return;
  }
  try{
    Promise.resolve(fn()).catch(e=>{
      console.warn('sync failed (ignored):', e);
    });
  }catch(e){
    console.warn('sync threw (ignored):', e);
  }
}

function initSupabase(){
  try{
    if(!window.supabase || !window.supabase.createClient){
      console.warn('Supabase SDK 未読込');
      state.serverConnected = false;
      setSyncState('offline');
      updateLoginSyncText('サーバー未接続（ローカルモード）');
      return;
    }
    state.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      realtime: { params: { eventsPerSecond: 10 } }
    });
    setSyncState('connecting');
    updateLoginSyncText('サーバーに接続中…');
  }catch(e){
    console.error('Supabase init error', e);
    state.supabase = null;
    state.serverConnected = false;
    setSyncState('error');
    updateLoginSyncText('サーバー接続エラー（ローカルモード）');
  }
}

async function fetchFromServer(){
  if(!state.supabase) return false;
  try{
    setSyncState('syncing');

    const [fl, flt, usr, lg] = await Promise.all([
      state.supabase.from('flights').select('*'),
      state.supabase.from('fleet').select('*'),
      state.supabase.from('app_users').select('*'),
      state.supabase.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(500)
    ]);

    if(fl.error || flt.error || usr.error || lg.error){
      console.warn('fetch had errors', fl.error, flt.error, usr.error, lg.error);
      // どれか1つでもエラーならサーバー扱いにしない（ローカル優先）
      state.serverConnected = false;
      setSyncState('error');
      updateLoginSyncText('サーバーデータ未整備（ローカルモード）');
      return false;
    }

    if(fl.data && fl.data.length){
      state.flights = fl.data.map(f=>({
        id:f.id, no:f.no, from:f.from_ap, to:f.to_ap,
        dep:f.dep, arr:f.arr, baseDep:f.base_dep, baseArr:f.base_arr,
        date:f.date, ac:f.ac, status:f.status,
        delayMin:f.delay_min||0, note:f.note||'', lock:null
      }));
    }
    if(flt.data && flt.data.length){
      state.fleet = flt.data.map(a=>({
        id:a.id, reg:a.reg, type:a.type, status:a.status,
        base:a.base, service:a.service||'domestic',
        maintStart:a.maint_start, maintEnd:a.maint_end,
        assignedTo:a.assigned_to
      }));
    }
    if(usr.data && usr.data.length){
      state.users = usr.data.map(u=>({
        id:u.id, name:u.name, pass:u.pass, role:u.role,
        visibleInAdmin:u.visible_in_admin
      }));
    }
    if(lg.data){
      state.logs = lg.data.map(l=>({
        id:l.id, time:l.time, actor:l.actor, role:l.role,
        type:l.type, target:l.target, detail:l.detail, synced:true
      }));
    }

    state.serverConnected = true;
    state.pendingSync = false;
    saveLocal();
    setSyncState('online');
    updateLoginSyncText('サーバー同期済み');
    return true;
  }catch(e){
    console.error('fetch failed', e);
    state.serverConnected = false;
    setSyncState('error');
    updateLoginSyncText('サーバー未接続（ローカルモード）');
    return false;
  }
}

async function pushFlights(list){
  if(!state.supabase || !list.length) return;
  const payload = list.map(f=>({
    id:f.id, no:f.no, from_ap:f.from, to_ap:f.to,
    dep:f.dep, arr:f.arr, base_dep:f.baseDep, base_arr:f.baseArr,
    date:f.date, ac:f.ac, status:f.status,
    delay_min:f.delayMin||0, note:f.note||''
  }));
  const {error} = await state.supabase.from('flights').upsert(payload);
  if(error) throw error;
}
async function deleteFlightServer(id){
  if(!state.supabase) return;
  const {error} = await state.supabase.from('flights').delete().eq('id', id);
  if(error) throw error;
}
async function pushFleet(list){
  if(!state.supabase || !list.length) return;
  const payload = list.map(a=>({
    id:a.id, reg:a.reg, type:a.type, status:a.status, base:a.base,
    service:a.service||'domestic',
    maint_start:a.maintStart||null, maint_end:a.maintEnd||null,
    assigned_to:a.assignedTo||null
  }));
  const {error} = await state.supabase.from('fleet').upsert(payload);
  if(error) throw error;
}
async function pushUsers(list){
  if(!state.supabase || !list.length) return;
  const payload = list.map(u=>({
    id:u.id, name:u.name, pass:u.pass, role:u.role,
    visible_in_admin: u.visibleInAdmin!==false
  }));
  const {error} = await state.supabase.from('app_users').upsert(payload);
  if(error) throw error;
}
async function deleteUserServer(id){
  if(!state.supabase) return;
  const {error} = await state.supabase.from('app_users').delete().eq('id', id);
  if(error) throw error;
}
async function pushLog(entry){
  if(!state.supabase) return;
  const payload = {
    id: entry.id, time: entry.time, actor: entry.actor, role: entry.role,
    type: entry.type, target: entry.target, detail: entry.detail, synced: true
  };
  const {error} = await state.supabase.from('audit_logs').upsert(payload);
  if(error) throw error;
}

function subscribeRealtime(){
  if(!state.supabase) return;
  try{
    state.realtimeChannel = state.supabase
      .channel('nfs-sync')
      .on('postgres_changes', {event:'*', schema:'public', table:'flights'}, async ()=>{
        try{
          await fetchFromServer();
          if(state.session) render();
        }catch(e){ console.warn(e); }
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'fleet'}, async ()=>{
        try{ await fetchFromServer(); if(state.session) render(); }catch(e){ console.warn(e); }
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'app_users'}, async ()=>{
        try{ await fetchFromServer(); if(state.session) render(); }catch(e){ console.warn(e); }
      })
      .subscribe((status)=>{
        console.log('RT status', status);
        if(status==='SUBSCRIBED') setSyncState('online');
      });
  }catch(e){ console.warn('realtime error', e); }
}

/* ============================================================
   オンライン / オフライン
   ============================================================ */
window.addEventListener('online', ()=>{
  state.online = true;
  if(state.serverConnected) setSyncState('online');
  else if(state.supabase) setSyncState('connecting');
});
window.addEventListener('offline', ()=>{ state.online=false; setSyncState('offline'); });

/* ============================================================
   起動
   ============================================================ */
function boot(){
  $('#login').style.display='none';
  $('#app').style.display='flex';
  $('#userName').textContent = state.session.name;
  $('#userRole').textContent = ROLE_JA[state.session.role] || state.session.role;
  $('#userAvatar').textContent = state.session.name[0];
  renderNav(); render();
}

(function init(){
  try {
    // STEP 1: まずローカルデータを読み込んで、必ずログインできるようにする
    const hasLocal = loadLocal();
    if(!state.users || !state.users.length || !state.fleet || !state.fleet.length){
      seed();
    }
    if(!Array.isArray(state.logs)) state.logs = [];

    // STEP 2: ログイン画面を表示（サーバーを待たない）
    if(state.session && state.session.id){
      boot();
    } else {
      $('#login').style.display='flex';
    }
    updateLoginSyncText('ローカルデータ準備完了（サーバー接続中…）');

    // STEP 3: 裏で Supabase 接続（失敗してもUIは止めない）
    setTimeout(async ()=>{
      initSupabase();
      if(!state.supabase){
        updateLoginSyncText('サーバー未接続（ローカルモード）');
        return;
      }
      const ok = await fetchFromServer();
      if(!ok){
        updateLoginSyncText('サーバー未接続（ローカルモードで動作中）');
        return;
      }
      // サーバーが空なら初期データ投入
      if(!state.users.length || !state.fleet.length || !state.flights.length){
        try{
          await pushFleet(state.fleet);
          await pushUsers(state.users);
          await pushFlights(state.flights);
        }catch(e){ console.warn('initial push failed', e); }
      }
      // Realtime購読
      subscribeRealtime();
      // 再描画
      if(state.session) render();
    }, 100);

  } catch(err){
    console.error('初期化エラー:', err);
    // 最悪のケース：ローカルも壊れてる → 強制リセット
    try{
      localStorage.removeItem(LS_KEY);
      seed();
      $('#login').style.display='flex';
      updateLoginSyncText('ローカルモードで起動しました');
    }catch(e2){
      document.body.innerHTML = '<div style="padding:40px;color:#fff;font-family:sans-serif"><h2>初期化に失敗しました</h2><pre style="color:#f87171;margin-top:12px">'+err.message+'</pre></div>';
    }
  }
})();
</script>
